<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a rather personal question</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: hidden;
  position: relative;
  isolation: isolate;

  background: linear-gradient(
    135deg,
    #eaf5ff,
    #dceeff,
    #d5e9fb
  );

  color: #526e8c;
  font-family: 'Cormorant Garamond', serif;
}

/* soft background glow */
body::before,
body::after {
  content: "";
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.55;
  z-index: -1;
  pointer-events: none;
}

body::before {
  background: #b8dcff;
  top: -100px;
  left: -100px;
}

body::after {
  background: #c4d9f7;
  bottom: -100px;
  right: -100px;
}

/* main card */
.card {
  width: 100%;
  max-width: 430px;
  padding: 42px 30px;
  text-align: center;

  background: rgba(245, 250, 255, 0.88);
  border: 1px solid #c5ddf3;

  position: relative;
}

/* slides */
.slide {
  display: none;
  animation: fadeIn 0.7s ease;
}

.slide.active {
  display: block;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* portrait */
.portrait {
  width: 110px;
  height: 135px;
  object-fit: cover;
  object-position: center;

  border: 1px solid #c5ddf3;
  padding: 4px;
  margin-bottom: 24px;
}

/* text */
h1 {
  font-size: 29px;
  font-weight: 400;
  line-height: 1.5;
  color: #526e8c;
  margin: 0 0 20px;
}

.message {
  font-size: 19px;
  font-weight: 400;
  line-height: 1.8;
  color: #718ba6;

  max-width: 310px;
  margin: 0 auto;
}

/* buttons */
button {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 400;

  padding: 12px 24px;
  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
  transition: background 0.2s;
}

.continue {
  margin-top: 30px;

  background: #a9cdee;
  color: white;
  border: 1px solid #a9cdee;
}

.continue:hover,
.yes:hover {
  background: #8eb9e2;
}

/* yes / no area */
.buttons {
  height: 100px;
  position: relative;
  margin-top: 28px;
}

.yes {
  position: absolute;
  left: 12%;
  top: 15px;

  background: #a9cdee;
  color: white;
  border: 1px solid #a9cdee;
}

.no {
  position: absolute;
  left: 60%;
  top: 15px;

  background: transparent;
  color: #6885a3;
  border: 1px solid #c7dced;
}

/* after yes */
#response {
  font-size: 20px;
  font-weight: 400;
  color: #7199bd;
  line-height: 1.8;
  margin-top: 15px;
}

.footer {
  font-size: 14px;
  font-weight: 400;
  color: #a4bdd4;

  margin-top: 35px;
  letter-spacing: 1.5px;
}

.hidden {
  display: none !important;
}

/* mobile */
@media (max-width: 480px) {
  .card {
    padding: 36px 22px;
  }

  h1 {
    font-size: 27px;
  }

  .portrait {
    width: 100px;
    height: 125px;
  }

  .message {
    font-size: 18px;
  }
}
</style>
</head>

<body>

<div class="card">

  <!-- SLIDE 1 -->
  <div class="slide active" id="slide1">

    <img
      src="1000724568.jpeg"
      class="portrait"
      alt="photo"
    >

    <h1>I've been meaning to tell you...</h1>

    <p class="message">
      There's something I need to ask you.
    </p>

    <button class="continue" onclick="nextSlide()">
      continue
    </button>

  </div>


  <!-- SLIDE 2 -->
  <div class="slide" id="slide2">

    <h1>a rather personal question</h1>

    <p class="message" id="question">
      Can I keep you around, but like, romantically?
      I think u owe me a relationship, honestly.
    </p>

    <div class="buttons" id="buttons">

      <button class="yes" onclick="sayYes()">
        okay, you got me
      </button>

      <button class="no" id="noBtn">
        nope
      </button>

    </div>

    <div id="response"></div>

    <div class="footer" id="footer">
      made with questionable intentions
    </div>

  </div>

</div>


<script>

/* slide transition */
function nextSlide() {
  const slide1 = document.getElementById("slide1");
  const slide2 = document.getElementById("slide2");

  slide1.classList.remove("active");

  setTimeout(() => {
    slide2.classList.add("active");
  }, 150);
}


/* runaway no button */
const noBtn = document.getElementById("noBtn");
const buttons = document.getElementById("buttons");

function moveNo() {
  const padding = 5;

  const maxX = Math.max(
    padding,
    buttons.clientWidth - noBtn.offsetWidth - padding
  );

  const maxY = Math.max(
    padding,
    buttons.clientHeight - noBtn.offsetHeight - padding
  );

  noBtn.style.left =
    padding + Math.random() * (maxX - padding) + "px";

  noBtn.style.top =
    padding + Math.random() * (maxY - padding) + "px";
}

noBtn.addEventListener("mouseenter", moveNo);

noBtn.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveNo();
}, { passive: false });

noBtn.addEventListener("click", function(e) {
  e.preventDefault();
  moveNo();
});


/* yes button */
function sayYes() {

  document.querySelector("#slide2 h1").textContent = "it's a date.";

  document.getElementById("question").textContent =
    "I'll try not to make u regret this. No promises, though.";

  buttons.classList.add("hidden");

  document.getElementById("response").textContent =
    "guess you're stuck with me now.";

  document.getElementById("footer").textContent =
    "glad u said yes";
}

</script>

</body>
</html>
