<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a rather personal question</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@300;400&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(
    135deg,
    #eaf5ff 0%,
    #dceeff 45%,
    #d5e9fb 100%
  );
  padding: 24px;
  color: #526e8c;
  overflow: hidden;
  position: relative;
  isolation: isolate;
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.55;
  z-index: -1;
  pointer-events: none;
}

body::before {
  background: #b8dcff;
  top: -100px;
  left: -100px;
}

body::after {
  background: #c4d9f7;
  bottom: -100px;
  right: -100px;
}

.card {
  width: 100%;
  max-width: 430px;
  background: rgba(245, 250, 255, 0.88);
  padding: 42px 30px;
  text-align: center;
  border: 1px solid #c5ddf3;
  position: relative;
}

.portrait {
  width: 110px;
  height: 135px;
  object-fit: cover;
  object-position: center;
  border: 1px solid #c5ddf3;
  padding: 4px;
  margin-bottom: 24px;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 38px;
  font-weight: 400;
  margin: 0 0 24px;
  line-height: 1.3;
  color: #526e8c;
}

.message {
  font-family: 'Manrope', sans-serif;
  font-size: 13px;
  font-weight: 300;
  line-height: 2;
  color: #718ba6;
  max-width: 310px;
  margin: auto;
}

.buttons {
  height: 100px;
  position: relative;
  margin-top: 28px;
}

button {
  font-family: 'Manrope', sans-serif;
  font-size: 12px;
  font-weight: 400;
  padding: 12px 24px;
  cursor: pointer;
  transition: background 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.yes {
  position: absolute;
  left: 12%;
  top: 15px;
  background: #a9cdee;
  color: white;
  border: 1px solid #a9cdee;
}

.yes:hover {
  background: #8eb9e2;
}

.no {
  position: absolute;
  left: 60%;
  top: 15px;
  background: transparent;
  color: #6885a3;
  border: 1px solid #c7dced;
}

#response {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 400;
  font-style: normal;
  color: #7199bd;
  line-height: 1.6;
  margin-top: 10px;
}

.footer {
  font-family: 'Manrope', sans-serif;
  font-size: 10px;
  font-weight: 300;
  color: #a4bdd4;
  margin-top: 35px;
  letter-spacing: 2px;
}

.hidden {
  display: none !important;
}

@media (max-width: 480px) {
  .card {
    padding: 36px 22px;
  }

  h1 {
    font-size: 34px;
  }

  .portrait {
    width: 100px;
    height: 125px;
  }

  .message {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div class="card">

  <img
    src="1000724568.jpeg"
    class="portrait"
    alt="cute photo"
  >

  <h1>a rather personal question</h1>

  <p class="message">
    Can I keep you around, but like, romantically?
    I think u owe me a relationship, honestly.
  </p>

  <div class="buttons" id="buttons">
    <button class="yes" onclick="sayYes()">okay, you got me</button>
    <button class="no" id="noBtn">nope</button>
  </div>

  <div id="response"></div>

  <div class="footer" id="footer">
    made with questionable intentions
  </div>

</div>

<script>
const noBtn = document.getElementById("noBtn");
const buttons = document.getElementById("buttons");

function moveNo() {
  const padding = 5;

  const maxX = Math.max(
    padding,
    buttons.clientWidth - noBtn.offsetWidth - padding
  );

  const maxY = Math.max(
    padding,
    buttons.clientHeight - noBtn.offsetHeight - padding
  );

  const randomX = padding + Math.random() * (maxX - padding);
  const randomY = padding + Math.random() * (maxY - padding);

  noBtn.style.left = randomX + "px";
  noBtn.style.top = randomY + "px";
}

noBtn.addEventListener("mouseenter", moveNo);

noBtn.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveNo();
}, { passive: false });

noBtn.addEventListener("click", function(e) {
  e.preventDefault();
  moveNo();
});

function sayYes() {
  document.querySelector("h1").textContent = "it's a date.";

  document.querySelector(".message").textContent =
    "I'll try not to make u regret this. No promises, though.";

  buttons.classList.add("hidden");

  document.getElementById("response").textContent =
    "guess you're stuck with me now.";

  document.getElementById("footer").textContent =
    "glad u said yes";
}
</script>

</body>
</html>
