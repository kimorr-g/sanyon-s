<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #dceeff;
      padding: 24px;
      color: #40566d;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #f5faff;
      padding: 35px 28px;
      text-align: center;
      border: 1px solid #c5ddf3;
    }

    .photo {
      width: 180px;
      height: 210px;
      object-fit: cover;
      object-position: center;
      border-radius: 4px;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      font-weight: 400;
      margin: 0 0 22px;
      line-height: 1.3;
      color: #526e8c;
    }

    .message {
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 300;
      line-height: 2;
      color: #718ba6;
      max-width: 310px;
      margin: auto;
    }

    .buttons {
      height: 90px;
      position: relative;
      margin-top: 25px;
    }

    button {
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      font-weight: 400;
      padding: 12px 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .yes {
      position: absolute;
      left: 10%;
      top: 15px;
      background: #a9cdee;
      color: #fff;
      border: 1px solid #a9cdee;
    }

    .yes:hover {
      background: #8eb9e2;
    }

    .no {
      position: absolute;
      left: 65%;
      top: 15px;
      background: transparent;
      color: #6885a3;
      border: 1px solid #c7dced;
    }

    #response {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 24px;
      font-weight: 400;
      color: #7199bd;
      line-height: 1.6;
      margin-top: 15px;
    }

    .footer {
      font-family: 'Manrope', sans-serif;
      font-size: 10px;
      font-weight: 300;
      color: #a4bdd4;
      margin-top: 30px;
      letter-spacing: 1px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Ganti link gambar di bawah sesuai keinginan -->
    <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400" alt="Photo" class="photo">
    
    <h1>Would you go out with me?</h1>
    
    <p class="message">
      I've been meaning to ask you this for a while now. What do you say?
    </p>

    <div class="buttons" id="btn-group">
      <button class="yes" onclick="sayYes()">okay, you got me</button>
      <button class="no" id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()">no</button>
    </div>

    <div id="response" class="hidden">
      Yay! It's a date then ♡
    </div>

    <div class="footer">MADE JUST FOR YOU</div>
  </div>

  <script>
    function sayYes() {
      document.getElementById('btn-group').classList.add('hidden');
      document.getElementById('response').classList.remove('hidden');
    }

    function moveButton() {
      const noBtn = document.getElementById('noBtn');
      const container = document.getElementById('btn-group');
      
      const maxX = container.clientWidth - noBtn.offsetWidth;
      const maxY = container.clientHeight - noBtn.offsetHeight;
      
      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);
      
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }
  </script>

</body>
</html>
